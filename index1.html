<?xml version="1.0" encoding="UTF-8"?>
<streaming>
  <service>
    <name>Facebook Live RTMPS New</name>
    <servers>
      <server>
        <name>Facebook Primary</name>
        <url>rtmps://live-api-s.facebook.com:443/rtmp/</url>
      </server>
    </servers>
    <profiles>
      <profile>
        <name>Facebook HD Stable</name>
        <config resolution="HD">
          <bitrate>4500000</bitrate>
          <audio-bitrate>128000</audio-bitrate>
          <keyframe-interval>2</keyframe-interval>
        </config>
      </profile>
      <profile>
        <name>Facebook 720p Backup</name>
        <config resolution="720p">
          <bitrate>2500000</bitrate>
          <audio-bitrate>128000</audio-bitrate>
          <keyframe-interval>2</keyframe-interval>
        </config>
      </profile>
    </profiles>
  </service>
</streaming>
